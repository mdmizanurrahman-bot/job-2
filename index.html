
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assalamu Alaikum</title>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .welcome {
            text-align: center;
            animation: fadeIn 2s ease;
        }

        .arabic {
            font-family: 'Amiri', serif;
            font-size: clamp(55px, 10vw, 90px);
            color: #222222;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 300;
            letter-spacing: 3px;
            color: #222222;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="welcome">
        <div class="arabic">السَّلَامُ عَلَيْكُمْ</div>
        <h1>Assalamu Alaikum</h1>
    </div>

</body>
</html>
